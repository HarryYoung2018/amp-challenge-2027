expected_train_sequences = 914
expected_validation_sequences = 199
train_folds = [0, 1, 2, 3]
validation_fold = 4
component_weighting = "homology_component_equal_within_role_v1"

[model]
kind = "bidirectional_pre_layer_norm_transformer"
alphabet = "ACDEFGHIKLMNPQRSTVWY"
min_length = 8
max_length = 50
special_tokens = ["PAD", "MASK"]
layers = 4
hidden_dim = 256
attention_heads = 8
ffn_dim = 1024
activation = "gelu"
dropout = 0.10
layer_norm_epsilon = 0.00001
token_embedding = "learned"
position_embedding = "learned_absolute_0_to_49"
length_embedding = "learned_8_to_50"
timestep_embedding = "learned_0_to_64_row_zero_reserved"
tie_residue_input_output_weights = true
attention_projection_bias = true
ffn_bias = true
final_layer_norm = true
output_bias = true
prediction_classes = 20
expected_trainable_parameters = 3205652
initialization = "normal_std_0.02_bias_zero_norm_scale_one"
property_conditioning = false
classifier_free_guidance = false
self_conditioning = false

[diffusion]
kind = "absorbing_mask_fixed_count"
levels = 64
schedule = "cosine_alpha_bar"
cosine_offset = 0.008
timestep_sampling = "uniform_integer_1_to_64"
mask_count = "ceil_length_times_mask_probability"
mask_position_sampling = "uniform_without_replacement"
prediction_target = "clean_residue"
loss_positions = "masked_valid_positions_only"
loss_reduction = "masked_mean_per_sequence_then_batch_mean"

[training]
seeds = [42, 43, 44]
reproducibility_seed = 42
batch_sequences = 128
sample_with_replacement = true
sampling_weight_application = "weighted_draw_only"
max_steps = 10000
optimizer = "adamw_unfused"
learning_rate = 0.0002
betas = [0.90, 0.95]
epsilon = 0.00000001
weight_decay = 0.01
exclude_from_weight_decay = ["bias", "normalization", "embedding"]
warmup_steps = 500
lr_schedule = "linear_warmup_cosine_decay"
final_learning_rate = 0.00002
gradient_clip_norm = 1.0
precision = "float32"
gradient_accumulation_steps = 1
early_stopping = false
checkpoint_selection = "final_step_10000_only"
validation_during_training = false
training_log_interval_steps = 100
ema = false
amp = false
tf32 = false
torch_compile = false

[determinism]
rng_derivation = "sha256_namespace_to_uint64_v1"
rng_namespaces = ["initialization", "minibatch", "timestep", "corruption", "dropout", "proposal"]
corruption_rng = "numpy_pcg64_2.4.6"
validation_rng = "sha256_counter_by_contract_sequence_timestep_replicate_v1"
proposal_rng = "pcg64dxsm_candidate_keyed_v1"
deterministic_algorithms = true
math_sdpa_only = true
mha_fastpath = false
cublas_workspace_config = ":4096:8"
cudnn_benchmark = false
dataloader_workers = 0
pytorch_allocator = "backend:native"
require_distinct_node_seed42_twin = true
require_exact_seed42_twin = true
twin_environment_equal_fields = ["python", "numpy", "torch", "torch_cuda", "safetensors", "triton", "nvidia_cudnn_cu13", "gpu_name", "compute_capability", "driver", "allocator"]

[environment]
python = "3.11.14"
numpy = "2.4.6"
torch = "2.14.0"
torch_cuda = "13.0"
safetensors = "0.6.2"
triton = "3.8.0"
nvidia_cudnn_cu13 = "9.24.0.43"
gpu_name = "NVIDIA A100-SXM4-80GB"
compute_capability = [8, 0]
checkpoint_format = "safetensors"
allow_pickle = false

[evaluation]
levels = 64
replicates_per_sequence_level = 4
expected_validation_sequences = 199
expected_corruption_cases = 50944
evaluation_seed = 20260904
batch_sequences = 256
primary_metric = "component_balanced_masked_token_nll_nats"
secondary_metrics = ["perplexity", "top1_accuracy", "top3_accuracy", "multiclass_brier", "ece_15_equal_width"]
timestep_bins = ["1_to_16", "17_to_32", "33_to_48", "49_to_64", "64_fully_masked"]
bootstrap_unit = "union_component_id"
bootstrap_replicates = 10000
bootstrap_seed = 20260904
bootstrap_confidence = 0.95

[baselines]
names = ["component_weighted_unigram", "component_weighted_bidirectional_markov", "length_relative_position_frequency"]
count_pseudocount = 0.5
count_weighting = "expected_train_sequences_times_sampling_weight_divided_by_sequence_length"
transition_count_weighting = "expected_train_sequences_times_sampling_weight_divided_by_sequence_length_minus_one"
bidirectional_markov_combination = "log_unigram_plus_available_forward_reverse_log_likelihood_ratios"
relative_position_length_bins = [8, 15, 20, 25, 33, 51]
relative_position_bins = 10
relative_position_prior_mass = 20.0
strongest_baseline_rule = "lowest_primary_validation_nll"
generator_controls = ["component_weighted_unigram", "component_weighted_forward_markov"]
memorization_control = "component_weighted_train_resampling_report_only"

[sampling]
checkpoint = "final_step_10000"
length_distribution = "train_only_component_weighted_empirical"
shared_length_plan_across_methods = true
reverse_steps = 64
reverse_target_mask_count = "ceil_length_times_previous_mask_probability"
reveal_order = "descending_max_residue_probability"
reveal_tie_break = "ascending_position"
categorical_draw_order = "reveal_order"
temperature = 1.0
top_k = 0
top_p = 1.0
rejection_retries = 0
raw_proposals_per_seed = 2048
batch_sequences = 256
report_before_filtering = true
length_rng = "sha256_counter_by_seed_ordinal_v1"
control_rng = "pcg64dxsm_by_method_seed_ordinal_position_v1"
distribution_reference = "training_projection_component_weighted"
distribution_candidate_pool = "deduplicated_canonical_exact_reference_safe"
ngram_orders = [1, 3]
ngram_reference_weighting = "sampling_weight_divided_by_available_ngrams"
descriptor_features = ["length", "molecular_weight_da", "net_charge", "charge_density", "isoelectric_point", "mean_hydrophobicity", "hydrophobic_moment", "hydrophobic_fraction", "aromatic_fraction", "basic_fraction", "acidic_fraction", "shannon_entropy", "max_residue_fraction"]
descriptor_standardization = "training_component_weighted_population_zscore_floor_1e-12"
descriptor_energy_distance = "weighted_v_statistic_euclidean"
top_reference_ratio = 0.80
identity_threshold = 0.70

[gates.denoising]
require_every_seed_beats_strongest_baseline = true
minimum_mean_relative_nll_improvement = 0.05
minimum_bootstrap_lower_bound_improvement = 0.0
bootstrap_lower_bound_comparator = "strictly_greater_than"
bootstrap_seed_aggregation = "arithmetic_mean_relative_improvement"
high_noise_timestep_bin = "49_to_64"
