high_noise_seed_aggregation = "arithmetic_mean_nll"
maximum_timestep_bin_relative_nll_regression = 0.01
timestep_bin_seed_aggregation = "arithmetic_mean_nll"
maximum_ece = 0.10
maximum_ece_regression = 0.02
ece_seed_rule = "every_seed"

[gates.sampling]
