schema_version = 1
artifact = "native_categorical_diffusion_unconditional_v0"
evidence_doc = "docs/benchmarks/native_categorical_diffusion_v0.md"

[status]
before_execution = "predeclared_not_run"
evidence_invalid = "invalid_run"
reproducible_no_go = "reproducible_no_go_v0"
candidate_generator_only = "accepted_as_unconditional_categorical_diffusion_v0_candidate_generator"

[input]
corpus_artifact = "categorical_diffusion_corpus_v1"
corpus_config_sha256 = "f08a64cf05ea2f536e33368f2d6579c49fd84ddb7caac67fdba38a557312a6e6"
corpus_sha256 = "c03595a8650b732307ada7e030f996d65345238efaea55d25925ac433bec8bc7"
