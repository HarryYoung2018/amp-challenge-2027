summary_sha256 = "711e0f5498691e186b32c0e066434c7a8b2ac0a0e6cf0958bafc711a9a065332"
manifest_sha256 = "8f546c93fcdfe0a6fd28fe7d7c0bea7d4e64ede17fac296fd9b6f9c0cb17d280"
