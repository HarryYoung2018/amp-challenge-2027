expected_assay_observations = 6079
expected_study_memberships = 1136

# Homology means deterministic single-link connected components under the
# repository's global-alignment identity (matches/alignment length). Every
# homology component is then united with every shared study-key hyperedge.
identity_threshold = 0.80
folds = 5
seed = 42

# Greedy placement minimizes the sum of normalized squared deviations over
# these predeclared dimensions. Equal weights prevent small label strata from
# disappearing behind the much larger sequence census.
[balance_weight]
component_count = 1.0
sequences = 1.0
gram_negative_mic16_negative = 1.0
gram_negative_mic16_positive = 1.0
gram_positive_mic16_negative = 1.0
gram_positive_mic16_positive = 1.0

# Every primary Gram-by-label stratum must remain represented in every fold.
# These are feasibility guards, not targets selected from model performance.
[balance_minimum]
gram_negative_mic16_negative = 1
gram_negative_mic16_positive = 1
gram_positive_mic16_negative = 1
gram_positive_mic16_positive = 1
