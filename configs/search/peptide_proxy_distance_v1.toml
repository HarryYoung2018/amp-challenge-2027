schema_version = 1
study_id = "peptide_proxy_distance_v1"
release_status = "planned_requires_method_provider_admission"
claim_scope = "optimization_of_a_frozen_computational_oracle_not_biological_ground_truth"
seeds = [73121, 73122, 73123, 73124, 73125]
initial_size = 512
additional_evaluations = 1024
batch_size = 16
clip_ratio_width = 0.05
update_reference = "previous_accepted_model"
constraint_scope = "conditional_residue_transition_distributions"
global_sequence_constraint_qualified = false
per_transition_total_variation_limit = 0.05
ground_cost_id = "canonical_amino_acid_composition_identity_v1"
ground_cost_claim = "exploratory_geometry_not_validated_activity_distance"
diagnostics = ["kl", "reverse_kl", "jensen_shannon", "wasserstein_1", "total_variation"]
deferred_behavioral_ablations = ["no_kl", "no_counterfactual"]

# These thresholds have distinct units and are NOT interchangeable guarantees.
# The Wasserstein arm uses bounded residue-transition cost, not unscaled features.
# Transition-level checks do not certify a 5% bound on complete peptide distributions.
[[arms]]
name = "evolutionary_kl"
method = "evolutionary"
constraint = "kl"
threshold = 0.005
units = "natural_log_nats"

[[arms]]
name = "evolutionary_wasserstein"
method = "evolutionary"
constraint = "wasserstein_1"
threshold = 0.05
units = "bounded_residue_transition_ground_cost"

[[arms]]
name = "evolutionary_total_variation"
method = "evolutionary"
constraint = "total_variation"
threshold = 0.05
units = "absolute_probability_mass"

[[arms]]
name = "categorical"
method = "categorical"
constraint = "none"
threshold = 0.0
units = "not_applicable"

[[arms]]
name = "genetic_algorithm"
method = "genetic_algorithm"
constraint = "none"
threshold = 0.0
units = "not_applicable"
